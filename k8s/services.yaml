# OpsGuardian - Kubernetes Services
apiVersion: v1
kind: Service
metadata:
  name: opsguardian-backend-svc
  namespace: default
spec:
  selector:
    app: opsguardian-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: opsguardian-ai-engine-svc
  namespace: default
spec:
  selector:
    app: opsguardian-ai-engine
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: opsguardian-frontend-svc
  namespace: default
spec:
  selector:
    app: opsguardian-frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: NodePort
